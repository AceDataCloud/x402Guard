apiVersion: apps/v1
kind: Deployment
metadata:
  name: x402guard-api
  namespace: acedatacloud
  labels:
    app: x402guard
    component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: x402guard
      component: api
  template:
    metadata:
      labels:
        app: x402guard
        component: api
    spec:
      imagePullSecrets:
        - name: docker-registry
      containers:
        - name: api
          image: ghcr.io/acedatacloud/x402guard-api:${TAG}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_ENV
              value: production
            - name: APP_DEBUG
              value: "false"
            - name: SOLANA_CLUSTER
              value: mainnet
            - name: SOLANA_RPC_URL
              value: https://api.mainnet-beta.solana.com
            - name: USDC_MINT
              value: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
            - name: AGENT_VAULT_PROGRAM_ID
              value: "5s9rscxcoXZMLwn2cenGYhj6zd5voyMHAmFBe4qhZQxH"
            - name: CORS_ALLOWED_ORIGINS
              value: https://x402guard.acedata.cloud
          envFrom:
            - secretRef:
                name: x402guard-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: x402guard-api
  namespace: acedatacloud
  labels:
    app: x402guard
    component: api
spec:
  type: ClusterIP
  selector:
    app: x402guard
    component: api
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
