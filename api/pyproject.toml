[tool.poetry]
name = "x402guard-api"
version = "0.1.0"
description = "x402guard backend — REST + Solana tx builders + per-vault MCP endpoint"
authors = ["Ace Data Cloud Dev <dev@acedata.cloud>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "core" }, { include = "routes" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.35" }
asyncpg = "^0.29.0"
aiosqlite = "^0.20.0"  # used by tests + local dev
solana = "^0.34.3"
solders = "^0.21.0"
httpx = "^0.27.0"
loguru = "^0.7.2"
pynacl = "^1.5.0"  # ed25519 signature verification (Phantom auth)
cryptography = "^43.0.0"  # delegation key wrap with AES-GCM

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.6.0"
respx = "^0.21.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # SQLAlchemy 2.x warns about asyncio loop binding under pytest-asyncio's
    # default function-scoped loops; harmless in tests.
    "ignore::DeprecationWarning:sqlalchemy.*",
]
