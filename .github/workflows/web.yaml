name: web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yaml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yaml"

defaults:
  run:
    working-directory: web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # Skip Playwright in CI for the scaffold PR — the smoke suite needs
      # the dev server, which means we'd have to provision Chromium too.
      # Re-enable in the next PR (`feat/web-vault-flows`) once we have
      # interactions worth testing.
