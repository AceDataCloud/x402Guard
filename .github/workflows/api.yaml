name: api

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api.yaml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api.yaml"

defaults:
  run:
    working-directory: api

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "fastapi>=0.115" "uvicorn[standard]>=0.32" \
            "pydantic>=2.9" "pydantic-settings>=2.5" \
            "sqlalchemy[asyncio]>=2.0" "aiosqlite>=0.20" \
            "solana>=0.34" "solders>=0.21" \
            "httpx>=0.27" "loguru>=0.7" \
            "pynacl>=1.5" "cryptography>=43" \
            ruff pytest pytest-asyncio

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: PYTHONPATH=.. pytest tests/ -v
