name: deploy

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "web/**"
      - "deploy/**"
      - ".github/workflows/deploy.yaml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_api: ${{ steps.names.outputs.image_api }}
      image_web: ${{ steps.names.outputs.image_web }}
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects mixed-case image names. `github.repository_owner` is
      # `AceDataCloud` (mixed case) on this repo, so we lower-case it once
      # and reuse via job outputs / step env. See the historical failure:
      # > ERROR: failed to build: invalid tag
      # >   "ghcr.io/AceDataCloud/x402guard-api:...":
      # >   repository name must be lowercase
      - name: Compute lowercase image names
        id: names
        run: |
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_api=ghcr.io/${owner_lc}/x402guard-api" >> "$GITHUB_OUTPUT"
          echo "image_web=ghcr.io/${owner_lc}/x402guard-web" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.image_api }}:${{ github.run_id }}
            ${{ steps.names.outputs.image_api }}:latest

      - name: Build + push web
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.image_web }}:${{ github.run_id }}
            ${{ steps.names.outputs.image_web }}:latest

  # Cluster credentials live in repo secrets the AceDataCloud platform
  # team manages; the deploy step is gated on the platform secret being
  # present so contributor PRs build images without trying to deploy.
  rollout:
    needs: images
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_TO_K8S == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.2
      - name: Configure cluster
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
      - name: Deploy
        env:
          # `deploy/run.sh` substitutes ${TAG} in the manifests; it reads
          # BUILD_NUMBER first, falling back to `local`. We pass the
          # GitHub Actions run id so the rolled-out pods reference the
          # exact image tag we just built+pushed in the `images` job.
          BUILD_NUMBER: ${{ github.run_id }}
        run: bash deploy/run.sh
