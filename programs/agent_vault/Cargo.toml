[package]
name = "agent_vault"
version = "0.1.0"
description = "Solana-native spending guardrails for AI agents (Colosseum Frontier 2026)"
edition = "2021"
license = "MIT"
authors = ["Ace Data Cloud <dev@acedata.cloud>"]
repository = "https://github.com/AceDataCloud/x402guard"

[lib]
crate-type = ["cdylib", "lib"]
name = "agent_vault"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = { version = "0.30.1", features = ["token"] }
