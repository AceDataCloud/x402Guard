# nginx routing config baked into the web image.
#
#   /                — Vue SPA (history mode fallback to index.html)
#   /api/*           — proxied to api service
#   /mcp/*           — proxied to api service (Streamable HTTP MCP)
#   /health          — proxied to api (k8s liveness probe goes to /api/health
#                      so this route is just for ad-hoc curl)
#   /.well-known/*   — proxied to api (clients discover cluster + program ID)

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA fallback — every non-asset path resolves to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy — `x402guard-api` is the docker-compose service name AND
    # the k8s Service name (deploy/production/api.yaml). Both resolve via
    # in-cluster DNS / docker-compose DNS.
    location /api/ {
        proxy_pass http://x402guard-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Streamable HTTP MCP — same upstream, but separate location so we
    # can tune timeouts independently if needed (long-running
    # `aceguard.pay_for_api` may hit a slow upstream API).
    location /mcp/ {
        proxy_pass http://x402guard-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    location /.well-known/ {
        proxy_pass http://x402guard-api:8000;
    }

    # Operational health probe — reaches the api liveness endpoint
    # without going through the SPA fallback. Useful for ad-hoc curl
    # and for ingress / load-balancer health checks that target the
    # web pod (k8s probes hit the api pod directly via Service).
    location = /health {
        proxy_pass http://x402guard-api:8000/health;
    }

    # Static asset cache headers (Vite emits hashed filenames so this is
    # safe for the long-tail).
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
